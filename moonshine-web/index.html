<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moonshine Web</title>
    <script>
      // Redirect the transcription worker to our API-backed worker.
      // The original worker bundles ONNX + Transformers.js for in-browser
      // inference; our replacement calls the local FastAPI server instead.
      (function () {
        var Orig = window.Worker;
        window.Worker = function (url, opts) {
          var s = (url instanceof URL ? url.href : String(url));
          if (s.indexOf("worker-D9nS5ej1") !== -1 || s.indexOf("worker-BrsEphLD") !== -1) {
            console.log("[moonshine] Using API worker → http://127.0.0.1:8001");
            const w = new Orig(new URL("/assets/worker-api.js", location.origin), opts);
            // Store global reference so model selector can message the worker
            window.__moonshine_worker = w;
            return w;
          }
          return new Orig(url, opts);
        };
        window.Worker.prototype = Orig.prototype;
      })();
    </script>
    <script type="module" crossorigin src="/assets/index-DBlYkRpE.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-Br9ehX_t.css">
  </head>
  <body>
    <div id="model-selector" style="position: fixed; top: 10px; right: 10px; background: rgba(255,255,255,0.9); padding: 12px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); z-index: 9999; font-family: system-ui, -apple-system, sans-serif; font-size: 13px;">
      <label style="display: block; margin-bottom: 8px; font-weight: 600; color: #333;">ASR Model:</label>
      <div style="display: flex; gap: 12px;">
        <label style="display: flex; align-items: center; gap: 6px; cursor: pointer;">
          <input type="radio" name="asr_model" value="moonshine" id="model_moonshine" style="cursor: pointer;">
          <span id="moonshine_label">Moonshine</span>
        </label>
        <label style="display: flex; align-items: center; gap: 6px; cursor: pointer;">
          <input type="radio" name="asr_model" value="whisper" id="model_whisper" style="cursor: pointer;">
          <span id="whisper_label">Whisper</span>
        </label>
      </div>
      <div id="model_status" style="margin-top: 8px; font-size: 12px; color: #666;"></div>
    </div>
    <script>
      // Model selector logic
      (function() {
        const MODEL_KEY = 'asr_model';
        const DEFAULT_MODEL = 'moonshine';
        
        // Initialize model selection from localStorage
        const saved = localStorage.getItem(MODEL_KEY) || DEFAULT_MODEL;
        const radio = document.querySelector(`input[name="asr_model"][value="${saved}"]`);
        if (radio) radio.checked = true;
        updateStatusLabel(saved);
        
        // Listen for radio button changes
        document.querySelectorAll('input[name="asr_model"]').forEach(radio => {
          radio.addEventListener('change', function() {
            localStorage.setItem(MODEL_KEY, this.value);
            updateStatusLabel(this.value);
            console.log('[moonshine] Model switched to:', this.value);
            // Send model selection to worker
            if (window.__moonshine_worker && window.__moonshine_worker.postMessage) {
              window.__moonshine_worker.postMessage({ type: 'set-asr-model', model: this.value });
              console.log('[moonshine] Sent to worker: set model to', this.value);
            }
          });
        });
        
        // On page load, send initial model selection to worker when it's ready
        // (use a small delay to ensure worker is created)
        setTimeout(() => {
          const saved = localStorage.getItem(MODEL_KEY) || DEFAULT_MODEL;
          if (window.__moonshine_worker && window.__moonshine_worker.postMessage) {
            window.__moonshine_worker.postMessage({ type: 'set-asr-model', model: saved });
            console.log('[moonshine] Sent initial model to worker:', saved);
          }
        }, 100);
        
        function updateStatusLabel(model) {
          const status = document.getElementById('model_status');
          if (model === 'whisper') {
            status.textContent = '✓ Using Whisper (ggml-small)';
            status.style.color = '#0a7;';
          } else {
            status.textContent = '✓ Using Moonshine';
            status.style.color = '#0a7;';
          }
        }
      })();
    </script>
    <div id="root"></div>
    <script id="vertexshader" type="vertex">
      uniform float u_time;

      vec3 mod289(vec3 x)
      {
        return x - floor(x * (1.0 / 289.0)) * 289.0;
      }

      vec4 mod289(vec4 x)
      {
        return x - floor(x * (1.0 / 289.0)) * 289.0;
      }

      vec4 permute(vec4 x)
      {
        return mod289(((x*34.0)+10.0)*x);
      }

      vec4 taylorInvSqrt(vec4 r)
      {
        return 1.79284291400159 - 0.85373472095314 * r;
      }

      vec3 fade(vec3 t) {
        return t*t*t*(t*(t*6.0-15.0)+10.0);
      }

      // Classic Perlin noise, periodic variant
      float pnoise(vec3 P, vec3 rep)
      {
        vec3 Pi0 = mod(floor(P), rep); // Integer part, modulo period
        vec3 Pi1 = mod(Pi0 + vec3(1.0), rep); // Integer part + 1, mod period
        Pi0 = mod289(Pi0);
        Pi1 = mod289(Pi1);
        vec3 Pf0 = fract(P); // Fractional part for interpolation
        vec3 Pf1 = Pf0 - vec3(1.0); // Fractional part - 1.0
        vec4 ix = vec4(Pi0.x, Pi1.x, Pi0.x, Pi1.x);
        vec4 iy = vec4(Pi0.yy, Pi1.yy);
        vec4 iz0 = Pi0.zzzz;
        vec4 iz1 = Pi1.zzzz;

        vec4 ixy = permute(permute(ix) + iy);
        vec4 ixy0 = permute(ixy + iz0);
        vec4 ixy1 = permute(ixy + iz1);

        vec4 gx0 = ixy0 * (1.0 / 7.0);
        vec4 gy0 = fract(floor(gx0) * (1.0 / 7.0)) - 0.5;
        gx0 = fract(gx0);
        vec4 gz0 = vec4(0.5) - abs(gx0) - abs(gy0);
        vec4 sz0 = step(gz0, vec4(0.0));
        gx0 -= sz0 * (step(0.0, gx0) - 0.5);
        gy0 -= sz0 * (step(0.0, gy0) - 0.5);

        vec4 gx1 = ixy1 * (1.0 / 7.0);
        vec4 gy1 = fract(floor(gx1) * (1.0 / 7.0)) - 0.5;
        gx1 = fract(gx1);
        vec4 gz1 = vec4(0.5) - abs(gx1) - abs(gy1);
        vec4 sz1 = step(gz1, vec4(0.0));
        gx1 -= sz1 * (step(0.0, gx1) - 0.5);
        gy1 -= sz1 * (step(0.0, gy1) - 0.5);

        vec3 g000 = vec3(gx0.x,gy0.x,gz0.x);
        vec3 g100 = vec3(gx0.y,gy0.y,gz0.y);
        vec3 g010 = vec3(gx0.z,gy0.z,gz0.z);
        vec3 g110 = vec3(gx0.w,gy0.w,gz0.w);
        vec3 g001 = vec3(gx1.x,gy1.x,gz1.x);
        vec3 g101 = vec3(gx1.y,gy1.y,gz1.y);
        vec3 g011 = vec3(gx1.z,gy1.z,gz1.z);
        vec3 g111 = vec3(gx1.w,gy1.w,gz1.w);

        vec4 norm0 = taylorInvSqrt(vec4(dot(g000, g000), dot(g010, g010), dot(g100, g100), dot(g110, g110)));
        g000 *= norm0.x;
        g010 *= norm0.y;
        g100 *= norm0.z;
        g110 *= norm0.w;
        vec4 norm1 = taylorInvSqrt(vec4(dot(g001, g001), dot(g011, g011), dot(g101, g101), dot(g111, g111)));
        g001 *= norm1.x;
        g011 *= norm1.y;
        g101 *= norm1.z;
        g111 *= norm1.w;

        float n000 = dot(g000, Pf0);
        float n100 = dot(g100, vec3(Pf1.x, Pf0.yz));
        float n010 = dot(g010, vec3(Pf0.x, Pf1.y, Pf0.z));
        float n110 = dot(g110, vec3(Pf1.xy, Pf0.z));
        float n001 = dot(g001, vec3(Pf0.xy, Pf1.z));
        float n101 = dot(g101, vec3(Pf1.x, Pf0.y, Pf1.z));
        float n011 = dot(g011, vec3(Pf0.x, Pf1.yz));
        float n111 = dot(g111, Pf1);

        vec3 fade_xyz = fade(Pf0);
        vec4 n_z = mix(vec4(n000, n100, n010, n110), vec4(n001, n101, n011, n111), fade_xyz.z);
        vec2 n_yz = mix(n_z.xy, n_z.zw, fade_xyz.y);
        float n_xyz = mix(n_yz.x, n_yz.y, fade_xyz.x);
        return 2.2 * n_xyz;
      }

      uniform float u_frequency;

      void main() {
          float noise = 3.0 * pnoise(position + u_time, vec3(10.0));
          float displacement = (u_frequency / 30.) * (noise / 10.);
          vec3 newPosition = position + normal * displacement;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(newPosition, 1.0);
      }
    </script>
    <script id="fragmentshader" type="fragment">
      uniform float u_red;
      uniform float u_blue;
      uniform float u_green;
      void main() {
          gl_FragColor = vec4(vec3(u_red, u_green, u_blue), 1. );
      }
    </script>
  </body>
</html>
